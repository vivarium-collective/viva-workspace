[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "viva-workspace"
version = "0.1.0"
description = "Shared source of truth for viva workspace-layout logic (layout map, root-walker, study resolver, canonical outcomes, package naming)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["viva_workspace*"]

[tool.ruff.lint]
select = ["F", "E722"]
