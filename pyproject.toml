[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "viva-workspace"
version = "0.1.0"
description = "Shared source of truth for viva workspace-layout logic (layout map, root-walker, study resolver, canonical outcomes, package naming)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eran Agmon", email = "agmon.eran@gmail.com" }]
keywords = ["vivarium", "workspace", "process-bigraph", "study", "layout"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/vivarium-collective/viva-workspace"
Repository = "https://github.com/vivarium-collective/viva-workspace"
Issues = "https://github.com/vivarium-collective/viva-workspace/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["viva_workspace*"]

[tool.ruff.lint]
select = ["F", "E722"]
